[project]
name = "whatsapp_next"
authors = [
    { name = "Sanad Digital", email = "sanad@digital.info"}
]
description = "WhatsApp integration for ERPNext built on a provider abstraction (SND Platform first)"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=16.0.0" # Installed and managed by bench.
    # phonenumbers, requests: provided by frappe.
    "openpyxl>=3.1",   # ContactPicker source 4 (Excel)
    "vobject>=0.9.7",  # ContactPicker source 5 (vCard)
    "pypng>=0.20220715",  # PNG output of the WhatsApp QR codes (pyqrcode comes with frappe)
    "PyMuPDF>=1.24",   # a one-page PDF sent as an image (Settings → Policy)
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"

# These apt dependencies will be installed from Ubuntu repositories when you host your app on Frappe Cloud
[deploy.dependencies.apt]
packages = []

# What Frappe's Chromium needs to draw a Print Format whose PDF Generator is Chrome. Frappe Cloud
# (Press) reads this table (its current key; `[deploy.dependencies.apt]` above is the legacy one),
# although its bench image already carries these libraries and Chromium itself. On a bench you run
# yourself, run `sudo apps/whatsapp_next/scripts/install_pdf_deps.sh` (it handles Ubuntu 24.04's
# `t64` names) and `bench setup-chrome`.
[tool.frappe-cloud]
apt-dependencies = [
    "libnss3", "libnspr4", "libdbus-1-3", "libdrm2", "libxkbcommon0", "libxcomposite1",
    "libxdamage1", "libxfixes3", "libxrandr2", "libgbm1", "libpango-1.0-0", "libcairo2",
    "libxshmfence1", "libatk1.0-0", "libatk-bridge2.0-0", "libcups2", "libatspi2.0-0",
    "libasound2", "libglib2.0-0", "fonts-liberation",
]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["docs", ".claude", "node_modules"]

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
    "RUF",
]
ignore = [
    "B017", # assertRaises(Exception) - should be more specific
    "B018", # useless expression, not assigned to anything
    "B023", # function doesn't bind loop variable - will have last iteration's value
    "B904", # raise inside except without from
    "E101", # indentation contains mixed spaces and tabs
    "E402", # module level import not at top of file
    "E501", # line too long
    "E741", # ambiguous variable name
    "F401", # "unused" imports
    "F403", # can't detect undefined names from * import
    "F405", # can't detect undefined names from * import
    "F722", # syntax error in forward type annotation
    "W191", # indentation contains tabs
    "UP030", # Use implicit references for positional format fields (translations)
    "UP031", # Use format specifiers instead of percent format
    "UP032", # Use f-string instead of `format` call (translations)
    "UP037", # quoted annotations
    "UP040", # Use type aliases instead of type annotations
    "RUF001", # ambiguous unicode in strings (Arabic, typography)
    "RUF002", # ambiguous unicode in docstrings
    "RUF003", # ambiguous unicode in comments
    "RUF012", # mutable class attributes (Frappe controllers)
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.lint.per-file-ignores]
# Server Script bodies: Frappe runs them with `frappe` and `_` already in scope
"scripts/functions/*.py" = ["F821", "RUF005"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
