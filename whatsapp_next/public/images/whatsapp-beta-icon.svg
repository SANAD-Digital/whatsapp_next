<svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" viewBox="0 0 34 34" role="img" aria-label="WhatsApp (beta)">
  <!-- The WhatsApp sidebar icon (the green tile, bubble and handset the sidebar has always shown),
       with the product's β mark (`beta-mark.svg`) on a white disc in its corner: the whole app is
       in beta. The bubble moves up and in to make room; a ring in the tile's green cuts the disc
       out of it. The β is drawn whole and heavy, the cut that stays legible at 24 px. -->
  <rect x="1" y="1" width="32" height="32" rx="7.5" fill="#25D366"/>

  <g transform="translate(-2.4 -2.4)">
    <!-- chat bubble -->
    <circle cx="17.2" cy="17.2" r="8.2" fill="#FFFFFF"/>
    <path d="M10.8 23.3L10.1 26.1c-.1.5.4.9.9.7l3.1-1.1-3.3-2.4Z" fill="#FFFFFF"/>
    <!-- phone handset -->
    <path fill="#25D366" d="M13.6 13.7c.3-.3.8-.4 1.2-.2l1.2.8c.4.2.5.8.3 1.2l-.6 1c-.1.2-.1.4.1.7.4.6.9 1.1 1.5 1.5.2.1.5.2.7.1l1-.6c.4-.2.9-.1 1.2.3l.8 1.2c.2.4.2.9-.2 1.2l-.7.7c-.5.5-1.2.7-1.9.5-1.4-.4-2.8-1.3-4.1-2.6-1.3-1.3-2.1-2.7-2.6-4.1-.2-.7 0-1.4.5-1.9l.6-.8Z"/>
    <!-- signal waves -->
    <path d="M18.4 13.2c1 .4 1.8 1.2 2.2 2.2" fill="none" stroke="#25D366" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M19 11.1c1.7.6 3 1.9 3.6 3.6" fill="none" stroke="#25D366" stroke-width="1.3" stroke-linecap="round"/>
  </g>

  <!-- beta badge -->
  <circle cx="25.2" cy="25.2" r="7.6" fill="#FFFFFF" stroke="#25D366" stroke-width="1.6"/>
  <g transform="translate(18.4 18.2) scale(0.8)" fill="none" stroke="#0B7A3E" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5.4 14.6V6.3C5.4 4.3 6.6 3 8.3 3c1.7 0 2.8 1.1 2.8 2.5 0 1.4-1.1 2.4-2.6 2.4H7.6"/>
    <path d="M7.6 7.9h.6c2 0 3.5 1.3 3.5 3 0 1.8-1.4 3.1-3.2 3.1-1.3 0-2.4-.5-3.1-1.3"/>
  </g>
</svg>
