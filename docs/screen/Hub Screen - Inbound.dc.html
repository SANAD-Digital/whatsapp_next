<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../shared/support.js"></script>
<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="18" fill="#0F7A63"/><circle cx="50" cy="46" r="22" fill="#fff"/><path d="M28 76l5-13 10 3z" fill="#fff"/></svg></template>
</head>
<body>
<x-dc>
<helmet>
<script src="../shared/ui-kit.js?v=3"></script>
<script src="../shared/hub-data.global.js?v=5"></script>
<script src="../shared/hub-pages.js?v=1"></script>
<script src="../shared/hub-shared.js?v=2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#F5F7F6;--surface:#FFFFFF;--sunken:#EEF2F0;--border:#E3E8E6;--border-2:#C9D2CF;--ink:#0F1A18;--ink-2:#33423F;--ink-3:#55645F;--ink-4:#62716D;--pri:#0F7A63;--pri-d:#0A6250;--pri-s:#DFF1EC;--pri-sb:#B6DDD2;--on-pri:#FFFFFF;--ok:#1A8B50;--ok-s:#E1F3E8;--ok-i:#16713F;--ok-sb:#B9E2CA;--wn:#9A6C14;--wn-s:#FBF1DC;--wn-i:#8A6116;--wn-ix:#6F4E10;--wn-sb:#EFDCB4;--dg:#C9524B;--dg-s:#FBEAE8;--dg-i:#A93A34;--dg-sb:#F2CBC7;--nf:#2568AF;--nf-s:#E4EFFA;--nf-i:#1F5A97;--nf-sb:#C2DCF2;--shadow-lg:0 18px 40px -26px rgba(23,33,31,.5);}
  [data-theme="dark"]{--bg:#111A1D;--surface:#172226;--sunken:#1E2C31;--border:#2A363B;--border-2:#334247;--ink:#E4EBE9;--ink-2:#C4D0CD;--ink-3:#9CACA9;--ink-4:#94A4A1;--pri:#17A184;--pri-d:#63D3B8;--pri-s:#0D3730;--pri-sb:#1A5347;--on-pri:#04201A;--ok:#2FAF63;--ok-s:#103220;--ok-i:#6CD79C;--ok-sb:#1B4E33;--wn:#D9A33A;--wn-s:#37290E;--wn-i:#EEC069;--wn-ix:#F3D18A;--wn-sb:#54401A;--dg:#DE6F68;--dg-s:#3A1D1B;--dg-i:#F0A49E;--dg-sb:#562A27;--nf:#3E82CC;--nf-s:#14263C;--nf-i:#8FBAE8;--nf-sb:#213C60;--shadow-lg:0 18px 40px -26px rgba(0,0,0,.75);}
  html,body{margin:0;padding:0;background:var(--bg);}
  body{font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:var(--ink);}
  *{box-sizing:border-box;}
  a{color:var(--pri);text-decoration:none;} a:hover{color:var(--pri-d);text-decoration:underline;}
  input,button{font-family:inherit;}
  .lv-host > .sc-host{flex:1 1 0%;min-height:0;min-width:0;display:flex;overflow:hidden}
  .lv-host > .sc-host > *{flex:1 1 0%;min-height:0;min-width:0}
</style>
</helmet>
<div data-screen-label="الرسائل الواردة" dir="rtl" style="flex:1;min-height:0;height:100%;overflow-y:auto;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif">
  <div style="flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;padding:16px">

    <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;flex:none">
      <div style="display:flex;flex-direction:column;gap:4px">
        <h1 style="margin:0;font-size:18px;font-weight:700;letter-spacing:-.01em">الرسائل الواردة</h1>
        <span style="font-size:12px;color:var(--ink-3)">كل ما وصل من العملاء عبر الأجهزة، مع الأمر المطابق والردّ الآلي.</span>
      </div>
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <sc-if value="{{ hasScope }}" hint-placeholder-val="{{ false }}">
          <span style="display:inline-flex;align-items:center;gap:8px;min-height:32px;padding:0 10px;border-radius:8px;background:var(--pri-s);color:var(--pri-d);font-size:12px;font-weight:600">{{ scopeLabel }}<span onClick="{{ clearScope }}" title="إزالة" style="cursor:pointer;font-size:14px;line-height:1">×</span></span>
        </sc-if>
      </div>
    </div>

    <div class="lv-host" style="flex:1;min-height:340px;display:flex;overflow:hidden">
      <dc-import name="List View" loading="{{ loading }}" columns="{{ columns }}" rows="{{ rows }}" detail="{{ detail }}" range-key="ts" unit="رسالة" search-placeholder="اسم، رقم، أو نص الرسالة…" search-keys="{{ searchKeys }}" export-name="inbound" default-sort="{{ defaultSort }}" page-size="{{ 50 }}" density="{{ density }}" theme="{{ theme }}" hint-size="100%,100%"></dc-import>
    </div>
  </div>

  <sc-if value="{{ sendOpen }}" hint-placeholder-val="{{ false }}">
    <dc-import name="Send Message Dialog" prefill="{{ sendPrefill }}" on-close="{{ onSendClose }}" theme="{{ theme }}" hint-size="0,0"></dc-import>
  </sc-if>
  <dc-import name="Toasts" meta="{{ toastsMeta }}" fire="{{ toastFire }}" position="bottom-start" lang="ar" theme="{{ theme }}" embed="{{ true }}" show-docs="{{ false }}" hint-size="0,0"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:860},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;'light' | 'dark'&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;]},&quot;density&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;compact&quot;,&quot;tsType&quot;:&quot;'compact' | 'comfortable'&quot;,&quot;options&quot;:[&quot;compact&quot;,&quot;comfortable&quot;]},&quot;filter&quot;:{&quot;editor&quot;:null,&quot;default&quot;:null,&quot;tsType&quot;:&quot;{kind:'device'|'match'|'command'|'contact', value} | null&quot;},&quot;onNavigate&quot;:{&quot;editor&quot;:null,&quot;default&quot;:null,&quot;tsType&quot;:&quot;(route: string, filter?: object) =&gt; void&quot;}}">
const ROUTE = '/messages/inbound';

class Component extends DCLogic {
  state = { ready: typeof window !== 'undefined' && !!window.HubData, scope: null, fire: null, rev: 0, loading: true };

  componentDidMount() {
    const w = () => {
      if (window.HubData && window.HubShared) {
        const filter = this.props.filter || window.HubShared.takeFilter(ROUTE);
        this.setState({ ready: true, scope: filter || null });
        setTimeout(() => this.setState({ loading: false }), 260);
      } else this.t = setTimeout(w, 40);
    };
    w();
  }
  componentWillUnmount() { clearTimeout(this.t); }
  componentDidUpdate(pp) { if (pp.filter !== this.props.filter && this.props.filter) this.setState({ scope: this.props.filter }); }

  toast(f) { this.setState((s) => ({ fire: { ...f, n: (s.fire ? s.fire.n : 0) + 1 } })); }
  bump() { this.setState((s) => ({ rev: s.rev + 1 })); }
  theme() { return this.props.theme || (typeof document !== 'undefined' && document.documentElement.getAttribute('data-theme')) || 'light'; }

  renderVals() {
    const S = this.state, D = window.HubData, H = window.HubShared, theme = this.theme();
    const density = this.props.density || 'compact';
    if (!D || !H || !S.ready) return { theme, density, loading: true, sendTo: null, columns: [], rows: [], detail: null, searchKeys: [], defaultSort: null, hasScope: false, scopeLabel: '', clearScope: () => {}, goSimulator: () => {}, toastsMeta: { types: [] }, toastFire: null };
    const f = D.fmt;
    const go = (route, filter) => { if (this.props.onNavigate) return this.props.onNavigate(route, filter); H.goRoute(route, filter); };

    const sc = S.scope;
    let msgs = D.incoming.slice();
    let scopeLabel = '';
    if (sc) {
      if (sc.kind === 'device') { const d = D.deviceById(sc.value); msgs = msgs.filter((m) => m.deviceId === sc.value); scopeLabel = 'الجهاز: ' + (d ? d.name : sc.value); }
      if (sc.kind === 'match') { msgs = msgs.filter((m) => (sc.value === 'matched') === !!m.matchedCommand); scopeLabel = sc.value === 'matched' ? 'مطابقة لأمر' : 'بلا مطابقة'; }
      if (sc.kind === 'command') { msgs = msgs.filter((m) => m.matchedCommand === sc.value); const c = D.commands.find((x) => x.id === sc.value); scopeLabel = 'الأمر: ' + (c ? c.code : sc.value); }
      if (sc.kind === 'contact') { msgs = msgs.filter((m) => m.contactId === sc.value); const c = D.contactById(sc.value); scopeLabel = 'الجهة: ' + (c ? (c.name || c.phone) : sc.value); }
    }

    const devCell = (id) => { const d = D.deviceById(id) || { name: '—', initials: '—', color: 'var(--ink-4)' }; return { text: d.name, initials: d.initials, avBg: d.color, avFg: '#fff', sort: d.name }; };
    const ctCell = (id) => { const c = D.contactById(id) || { name: '', phone: '' }; return { text: c.name || 'بلا اسم — من دليل الجهاز', sub: c.phone, sort: c.name || 'ي' }; };
    const bodyOf = (m) => (m.body || '').replace('{no}', m.docNo || '').replace('{amt}', f.money(m.amount || 0));
    const cmdOf = (id) => (id ? D.commands.find((x) => x.id === id) : null);

    const columns = [
      { key: 'contact', label: 'المُرسِل', w: 210, kind: 'two', group: true },
      { key: 'text', label: 'النص الوارد', w: 220 },
      { key: 'match', label: 'الأمر المطابق', w: 200, kind: 'badge', group: true, filter: true },
      { key: 'linked', label: 'ربط الجهة', w: 120, kind: 'badge', group: true, filter: true },
      { key: 'device', label: 'الجهاز', w: 150, kind: 'avatar', group: true, filter: true },
      { key: 'ts', label: 'الوقت', w: 150, kind: 'time', group: true, groupLabel: 'اليوم' },
    ];
    const rows = msgs.slice(0, 4000).map((m) => {
      const cmd = cmdOf(m.matchedCommand), c = D.contactById(m.contactId) || {};
      return {
        id: m.id, contact: ctCell(m.contactId), text: m.text || '',
        match: cmd ? { text: cmd.code + ' — ' + cmd.fn, bg: 'var(--pri-s)', fg: 'var(--pri-d)', dot: 'var(--pri)', sort: cmd.code } : { text: 'بلا مطابقة', bg: 'var(--wn-s)', fg: 'var(--wn-ix)', dot: 'var(--wn)', sort: 'ي' },
        linked: c.linked ? { text: 'مربوط', bg: 'var(--ok-s)', fg: 'var(--ok-i)', dot: 'var(--ok)' } : { text: 'غير مربوط', bg: 'var(--sunken)', fg: 'var(--ink-3)', dot: 'var(--ink-4)' },
        device: devCell(m.deviceId), ts: m.ts, _m: m,
      };
    });

    const detail = (r) => {
      const m = r._m, cmd = cmdOf(m.matchedCommand);
      const reply = D.messages.find((x) => x.direction === 'out' && x.contactId === m.contactId && x.ts > m.ts);
      return {
        badge: cmd ? { text: 'مطابقة لأمر', tone: 'ok' } : { text: 'بلا مطابقة', tone: 'warn' },
        alert: cmd ? null : { tone: 'warn', title: 'لا أمر يطابق هذا النص', lines: ['النظام ردّ بقائمة الأوامر المتاحة. أضف «' + (m.text || '') + '» كمرادف لأمر قائم حتى يُطابَق تلقائياً.'] },
        fields: [
          { k: 'معرّف الرسالة', v: String(m.id).toUpperCase(), mono: true },
          { k: 'نوع الجهة', v: (D.PARTY_TYPES[(D.contactById(m.contactId) || {}).type] || {}).ar || '—' },
          { k: 'مربوط بحساب', v: (D.contactById(m.contactId) || {}).linked ? 'نعم' : 'لا' },
          { k: 'الأمر المطابق', v: cmd ? cmd.code : '—', mono: true },
          { k: 'الدالة', v: cmd ? cmd.fn : '—' },
          { k: 'الجهاز المستقبل', v: devCell(m.deviceId).text },
          { k: 'وقت الاستلام', v: f.date(m.ts) + ' ' + f.time(m.ts), mono: true },
        ],
        blocks: [].concat([{ label: cmd ? 'النص الوارد · أمر معرّف' : 'النص الوارد · نص غير مطابق', text: m.text || '—', tone: 'warn' }],
          reply ? [{ label: 'الردّ المُرسَل', text: bodyOf(reply), tone: 'ok' }] : [],
          reply ? [(() => { const sec = Math.max(0, (reply.ts - m.ts) / 1000); return { label: 'فارق الرد', text: (sec < 60 ? (Math.round(sec * 10) / 10) + ' ثانية' : f.n(Math.round(sec / 60)) + ' دقيقة') + ' بين استلام الوارد وإرسال الردّ' }; })()] : []),
        actions: [
          ...(cmd ? [{ label: 'فتح الأمر', onClick: () => go('/commands', { kind: 'command', value: cmd.id }) }] : [{ label: 'أضفه كمرادف', tone: 'primary', onClick: () => { const target = D.commands.find((x) => x.status === 'active'); if (target) { target.synonyms = target.synonyms || []; target.synonyms.push(m.text); } this.toast({ key: 'synonym', title: 'أُضيف «' + m.text + '» كمرادف', text: 'لأمر «' + (target ? target.code : '') + '». الرسائل التالية بهذا النص ستُطابَق تلقائياً.' }); this.bump(); } }]),
          ...(m.contactId ? [{ label: 'ردّ برسالة', closes: false, onClick: () => this.setState({ sendTo: { kind: 'contact', value: m.contactId } }) }] : []),
          { label: 'جهة الاتصال', onClick: () => go('/contacts', { kind: 'contact', value: m.contactId }) },
        ],
      };
    };

    return {
      sendOpen: !!S.sendTo, sendPrefill: S.sendTo, onSendClose: () => this.setState({ sendTo: null }),
      theme, density, loading: S.loading,
      columns, rows, detail, searchKeys: ['contact', 'text', 'match'], defaultSort: { key: 'ts', dir: 'desc' },
      hasScope: !!scopeLabel, scopeLabel, clearScope: () => this.setState({ scope: null }),
      goSimulator: () => go('/send'),
      toastsMeta: { position: 'bottom-start', duration: 4000, types: [{ key: 'synonym', tone: 'ok', icon: 'check' }] },
      toastFire: S.fire,
    };
  }
}
</script>
</body>
</html>
