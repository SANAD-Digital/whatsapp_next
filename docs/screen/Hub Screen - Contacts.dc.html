<style>

<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:860},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;'light' | 'dark'&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;]},&quot;filter&quot;:{&quot;editor&quot;:null,&quot;default&quot;:null,&quot;tsType&quot;:&quot;{kind:'contact'|'match'|'group', value} | null&quot;},&quot;onNavigate&quot;:{&quot;editor&quot;:null,&quot;default&quot;:null,&quot;tsType&quot;:&quot;(route: string, filter?: object) =&gt; void&quot;}}">
const ROUTE = '/contacts';
const STATUS_TONE = { read: { bg: 'var(--nf-s)', fg: 'var(--nf-i)' }, delivered: { bg: 'var(--nf-s)', fg: 'var(--nf-i)' }, sent: { bg: 'var(--sunken)', fg: 'var(--ink-2)' }, warn: { bg: 'var(--wn-s)', fg: 'var(--wn-i)' }, danger: { bg: 'var(--dg-s)', fg: 'var(--dg-i)' }, muted: { bg: 'var(--sunken)', fg: 'var(--ink-3)' } };

class Component extends DCLogic {
  state = { ready: typeof window !== 'undefined' && !!window.HubData, tab: 'system', scope: null, sendTo: null, panel: null, editId: null, fire: null, rev: 0, loading: true };
  componentDidMount() {

    w();
  }
  componentWillUnmount() { clearTimeout(this.t); }
  toast(f) { this.setState((s) => ({ fire: { ...f, n: (s.fire ? s.fire.n : 0) + 1 } })); }
  bump() { this.setState((s) => ({ rev: s.rev + 1 })); }
  theme() { return this.props.theme || (typeof document !== 'undefined' && document.documentElement.getAttribute('data-theme')) || 'light'; }

  initials(c) { if (!c.name) return '؟'; const words = c.name.replace(/^(شركة|مؤسسة|مصنع|مجموعة)\s+/, '').trim().split(/\s+/); const strip = (w) => (w.length > 3 && w.slice(0, 2) === 'ال' ? w.slice(2) : w); const a = strip(words[0]) || words[0]; const b = words[1] ? strip(words[1]) : ''; return b ? a[0] + b[0] : a.slice(0, 2); }
  matchOf(c) { return c.linked ? { text: 'مربوط', bg: 'var(--ok-s)', fg: 'var(--ok-i)', dot: 'var(--ok)', sort: 'a' } : { text: 'غير مربوط', bg: 'var(--wn-s)', fg: 'var(--wn-i)', dot: 'var(--wn)', sort: 'b' }; }

  editPanel(c, D, draft) {

    const accs = draft || (c.linked ? (c.accounts || []).map((a, i) => ({ name: a, type: (c.accountTypes || [])[i] || c.type })) : []);
    const setAccs = (next) => this.setState({ draftAccs: next, panel: this.editPanel(c, D, next) });

        { key: 'accountsList', label: 'الحسابات المرتبطة', type: 'list', span: 2, maxH: '200px',
          rowCols: '0 minmax(0,1fr) 0 100px 24px', head: ['', 'الجهة', '', 'نوع الجهة', ''],
          rowsData: accs.map((a, i) => ({ text: '', sub: a.name, tag: (D.PARTY_TYPES[a.type] || {}).ar || '—', tone: 'info', onRemove: () => setAccs(accs.filter((_, ix) => ix !== i)) })),
          add: { placeholder: 'اسم الجهة في الأستاذ المساعد…', label: '+ إضافة', options: Object.keys(D.PARTY_TYPES).map((k) => ({ v: k, l: D.PARTY_TYPES[k].ar })), onAdd: (txt, ty) => setAccs(accs.concat([{ name: txt, type: ty }])) },
          emptyText: 'لا حسابات مرتبطة بهذا الرقم.', hint: 'أضف الجهة ونوعها، ورقم واحد قد يخدم أكثر من جهة.' },
        { key: 'active', label: 'الحالة', type: 'readonly', span: 2, value: c.active === false ? 'معطّل' : 'مفعّل', hint: 'تُعدّل من زر «تفعيل/تعطيل» في بطاقة الجهة، وتُسجّل مع الملاحظات. المعطّل لا تُرسل له أي رسالة.' },

          hint: hasIn ? 'لا يمكن تعديلها: يوجد وارد فعلي من هذا الرقم.' : 'تُعدّل من زر «تغيير حالة» في بطاقة الجهة، وتُسجّل مع الملاحظات.' },
      ] }] },
      actions: [
        ...(isNew ? [] : [{ key: 'delete', label: 'حذف', variant: 'danger', align: 'start' }]),
        { key: 'cancel', label: 'إلغاء', variant: 'secondary', close: true },
        { key: 'save', label: isNew ? 'إضافة' : 'حفظ', variant: 'primary', requiresDirty: !isNew, close: true },
      ],

  }

  chatPanel(c, D) {
    const hasIn = !!(D.messages || []).find((m) => m.contactId === c.id && m.direction === 'in');
    const cur = hasIn ? 'وارد مسجّل في النظام' : c.chatManual === true ? 'مؤكد يدوياً' : 'لا محادثة';
    return {
      type: 'modal', width: '40%', title: 'تغيير حالة المحادثة', subtitle: (c.name || c.phone) + ' · ' + c.phone,
      badge: { text: cur, tone: hasIn ? 'ok' : c.chatManual ? 'info' : 'muted' },
      content: { sections: [{ title: 'الحالة', cols: 1, fields: [
        { key: 'cur', label: 'الحالة الحالية', type: 'readonly', value: cur },
        { key: 'chat', label: 'الحالة الجديدة', type: 'segment', value: c.chatManual === true ? 'yes' : 'no', options: [{ v: 'yes', l: 'يوجد محادثة' }, { v: 'no', l: 'لا يوجد' }], hint: 'أكّد وجود محادثة إذا جرت قبل ربط النظام ولم تُسجّل فيه.' },

      ] }] },
      actions: [
        { key: 'cancel', label: 'إلغاء', variant: 'secondary', close: true },
        { key: 'chatSave', label: 'حفظ التغيير', variant: 'primary', close: true },

  }

  statusPanel(c) {
    const on = c.active !== false;
    return {
      type: 'modal', width: '40%', title: on ? 'تعطيل الجهة' : 'تفعيل الجهة', subtitle: (c.name || c.phone) + ' · ' + c.phone,
      badge: { text: on ? 'مفعّل' : 'معطّل', tone: on ? 'ok' : 'danger' },
      content: { sections: [{ title: 'الحالة', cols: 1, fields: [
        { key: 'cur', label: 'الحالة الحالية', type: 'readonly', value: on ? 'مفعّل' : 'معطّل' },
        { key: 'active', label: 'الحالة الجديدة', type: 'readonly', value: on ? 'معطّل' : 'مفعّل', hint: on ? 'بعد الحفظ: لا تُرسل له أي رسالة — لا إشعارات آلية ولا حملات ولا إرسال يدوي.' : 'بعد الحفظ: يستقبل الإشعارات الآلية ويُستهدف في الحملات.' },
        { key: 'note', label: 'الملاحظات', type: 'textarea', rows: 3, value: '', required: true, stacked: true, placeholder: 'سبب التفعيل أو التعطيل — مثال: طلب العميل إيقاف الإشعارات.', hint: 'إلزامية، وتُحفظ في سجل التغييرات مع اسم من قام بالتغيير.' },
      ] }] },
      actions: [
        { key: 'cancel', label: 'إلغاء', variant: 'secondary', close: true },
        { key: 'statusSave', label: 'حفظ التغيير', variant: 'primary', close: true },
      ],
    };
  }

  renderVals() {
    const S = this.state, D = window.HubData, H = window.HubShared, theme = this.theme();
    if (!D || !H || !S.ready) return { theme, loading: true, sendOpen: false, sendPrefill: null, onSendClose: () => {}, openSend: () => {}, tabs: [], create: () => {}, hasScope: false, scopeLabel: '', clearScope: () => {}, cardsMeta: { sections: [] }, handlers: {}, columns: [], rows: [], detail: null, bulk: [], searchKeys: [], defaultSort: null, panel: null, onPanelAction: () => {}, onPanelClose: () => {}, toastsMeta: { types: [] }, toastFire: null };
    const f = D.fmt;
    const go = (route, filter) => { if (this.props.onNavigate) return this.props.onNavigate(route, filter); H.goRoute(route, filter); };
    const all = D.contacts;
    let base = all;
    let scopeLabel = '';
    const sc = S.scope;
    if (sc && sc.kind === 'contact') { base = base.filter((c) => c.id === sc.value); const c = D.contactById(sc.value); scopeLabel = 'الجهة: ' + (c ? (c.name || c.phone) : sc.value); }
    if (sc && sc.kind === 'match') { base = base.filter((c) => (sc.value === 'linked') === !!c.linked); scopeLabel = sc.value === 'linked' ? 'مربوط فقط' : 'غير مربوط فقط'; }

    const linked = all.filter((c) => c.linked).length, unlinkedAll = all.filter((c) => !c.linked).length;
    const multi = all.filter((c) => c.linked && (c.accounts || []).length > 1).length;
    const handlers = {

      showUnlinked: () => this.setState({ scope: { kind: 'match', value: 'unlinked' } }),
      clearScope: () => this.setState({ scope: null }),

    const cardsMeta = { handlers, sections: [{ min: 150, mobileColumns: 2, cards: [
      { kind: 'stat', icon: 'check', tone: 'ok', label: 'مربوط', value: f.n(linked), valueMono: true, note: 'مربوط بحساب ويستقبل الإشعارات', action: 'showLinked' },
      { kind: 'stat', icon: 'warn', tone: unlinkedAll ? 'warn' : undefined, label: 'غير مربوط', value: f.n(unlinkedAll), valueMono: true, note: 'بلا حساب في الأستاذ المساعد', action: 'showUnlinked' },
      { kind: 'stat', icon: 'user', label: 'مرتبط بأكثر من حساب', value: f.n(multi), valueMono: true, note: 'رقم واحد يخدم عميلين أو أكثر', action: 'clearScope' },
      { kind: 'stat', icon: 'chart', tone: 'info', label: 'نسبة التغطية', value: Math.round((linked / Math.max(1, all.length)) * 100) + '%', valueMono: true, note: 'من الجهات جاهزة للإشعارات', action: 'clearScope' },
    ] }] };

    const columns = [
      { key: 'contact', label: 'الجهة', w: 230, kind: 'avatar' },
      { key: 'phone', label: 'الرقم', w: 140, kind: 'mono' },
      { key: 'type', label: 'النوع', w: 110, group: true, filter: true },
      { key: 'match', label: 'حالة الربط', w: 130, kind: 'badge', group: true, filter: true },
      { key: 'nAccounts', label: 'عدد الحسابات المرتبطة', w: 150, kind: 'num', align: 'end' },
      { key: 'accounts', label: 'الحسابات المرتبطة', w: 240 },
      { key: 'active', label: 'الحالة', w: 110, kind: 'badge', group: true, filter: true },
      { key: 'chat', label: 'محادثة قائمة', w: 140, kind: 'badge', group: true, filter: true },
      { key: 'last', label: 'آخر رسالة', w: 140, kind: 'time' },
      { key: 'since', label: 'منذ', w: 110 },
    ];
    const inSet = new Set(D.messages.filter((m) => m.direction === 'in').map((m) => m.contactId));
    const rows = base.map((c) => { const mm = this.matchOf(c); const chatOn = inSet.has(c.id) || c.chatManual === true; const nAcc = c.linked ? (c.accounts || []).length : 0; const lm = D.messages.find((x) => x.contactId === c.id); const pt = D.PARTY_TYPES[c.type] || { ar: '—', color: 'var(--ink-4)' }; return { id: c.id, contact: { text: c.name || 'بلا اسم — من دليل الجهاز', initials: this.initials(c), avBg: c.linked ? 'var(--pri-s)' : 'var(--sunken)', avFg: c.linked ? 'var(--pri-d)' : 'var(--ink-3)', sort: c.name || 'ي' }, phone: c.phone, type: { text: pt.ar, color: pt.color, weight: 600 }, match: mm, chat: inSet.has(c.id) ? { text: 'وارد مسجّل', bg: 'var(--ok-s)', fg: 'var(--ok-i)', dot: 'var(--ok)', sort: 'a' } : c.chatManual === true ? { text: 'مؤكد يدوياً', bg: 'var(--pri-s)', fg: 'var(--pri-d)', dot: 'var(--pri)', sort: 'b' } : { text: 'لا محادثة', bg: 'var(--sunken)', fg: 'var(--ink-3)', dot: 'var(--ink-4)', sort: 'c' }, active: c.active === false ? { text: 'معطّل', bg: 'var(--dg-s)', fg: 'var(--dg-i)', dot: 'var(--dg)', sort: 'b' } : { text: 'مفعّل', bg: 'var(--ok-s)', fg: 'var(--ok-i)', dot: 'var(--ok)', sort: 'a' }, nAccounts: { value: nAcc, text: nAcc ? f.n(nAcc) : '0', color: nAcc > 1 ? 'var(--pri-d)' : nAcc ? undefined : 'var(--ink-4)', weight: nAcc > 1 ? 600 : 400 }, accounts: nAcc ? c.accounts.join(' · ') : '—', last: lm ? lm.ts : { text: '—', color: 'var(--ink-4)', sort: -1 }, since: { text: lm ? f.ago(lm.ts) : '—', sort: lm ? -lm.ts : 0, color: 'var(--ink-3)' }, _c: c }; });

    const detail = (r) => {
      const c = r._c, allM = D.messages.filter((m) => m.contactId === c.id);
      const msgs = allM.filter((m) => m.direction !== 'in'), inMsgs = allM.filter((m) => m.direction === 'in');
      const accTypes = c.accountTypes || [], accs = c.linked ? (c.accounts || []) : [];
      return {
        title: c.name || 'بلا اسم — من دليل الجهاز', sub: c.phone,
        alert: c.active === false
          ? { tone: 'danger', title: 'الجهة معطّلة', lines: ['لا تُرسل لها أي رسالة: لا إشعارات آلية ولا حملات ولا إرسال يدوي. فعّلها من زر «تفعيل» مع ملاحظة السبب.'] }
          : c.linked ? null : { tone: 'warn', title: 'الرقم غير مربوط بحساب', lines: ['الإشعارات الآلية لا تُرسل، والأوامر التي تتطلب ربطاً تُرفض. اربطه بحساب في الأستاذ المساعد ليعمل كل شيء.'] },
        fields: [
          { k: 'عدد الحسابات المرتبطة', v: f.n(accs.length), mono: true },
          { k: 'رسائل مرسلة', v: f.n(msgs.length) + (msgs.length ? ' · آخرها ' + f.ago(msgs[0].ts) : ''), mono: true },
          { k: 'رسائل واردة', v: f.n(inMsgs.length) + (inMsgs.length ? ' · آخرها ' + f.ago(inMsgs[0].ts) : ''), mono: true },
          { k: 'الحالة', v: c.active === false ? 'معطّل' : 'مفعّل', color: c.active === false ? 'var(--dg-i)' : 'var(--ok-i)' },
        ],
        blocks: [...(accs.length ? [{ label: 'الحسابات المرتبطة', list: accs.map((a, i) => ({ text: a, badge: (D.PARTY_TYPES[accTypes[i] || c.type] || {}).ar || '—', badgeTone: 'info' })) }] : []), ...((c.activeLog || []).length ? [{ label: 'سجل التفعيل والتعطيل', list: c.activeLog.map((L) => ({ text: L.to ? 'تفعيل' : 'تعطيل', sub: L.note, subMono: false, badge: L.by, badgeTone: 'muted' })) }] : []), ...((c.chatLog || []).length ? [{ label: 'سجل حالة المحادثة', list: c.chatLog.map((L) => ({ text: L.to ? 'يوجد محادثة' : 'لا يوجد', sub: L.note, subMono: false, badge: L.by, badgeTone: 'muted' })) }] : []), ...(msgs.length ? [{ label: 'آخر الرسائل', text: msgs.slice(0, 4).map((m) => m.docType + ' · ' + m.docNo + ' — ' + D.STATUS[m.status].ar + ' · ' + f.date(m.ts) + ' ' + f.time(m.ts)).join('\n') }] : [])],
        actions: [
          ...(c.linked ? [] : [{ label: 'اربطه بحساب', tone: 'primary', onClick: () => { c.linked = true; D.logActivity('رُبط رقم ' + c.phone + ' بحساب «' + (c.name || c.phone) + '»', 'primary'); this.toast({ key: 'linked', title: 'رُبط الرقم', text: 'الإشعارات الآلية ستصله من الآن.' }); this.bump(); } }]),
          ...(c.active === false ? [] : [{ label: 'إرسال رسالة', tone: 'primary', closes: false, onClick: () => this.setState({ sendTo: { kind: 'contact', value: c.id } }) }]),
          { label: 'تحرير', onClick: () => this.setState({ editId: c.id, draftAccs: null, panel: this.editPanel(c, D) }) },
          { label: c.active === false ? 'تفعيل' : 'تعطيل', onClick: () => this.setState({ statusId: c.id, panel: this.statusPanel(c) }) },
          ...(inMsgs.length ? [] : [{ label: 'تغيير حالة', onClick: () => this.setState({ chatId: c.id, panel: this.chatPanel(c, D) }) }]),
          { label: 'محاكي الواتساب', onClick: () => go('/send', { kind: 'contact', value: c.id }) },
          { label: 'سجل الرسائل', onClick: () => go('/messages/outbound', { kind: 'search', value: c.phone }) },
        ],
      };
    };
    const bulk = [{ label: 'إرسال رسالة للمحددة', onClick: (sel) => this.setState({ sendTo: { kind: 'contact', value: sel.map((r) => r.id) } }) }, { label: 'ربط المحددة', onClick: (sel) => { let n = 0; sel.forEach((r) => { if (!r._c.linked) { r._c.linked = true; n++; } }); this.toast({ key: 'linked', title: 'رُبطت ' + f.n(n) + ' جهة' }); this.bump(); } }];

    const editing = S.editId === 'new' ? { } : (S.editId ? D.contactById(S.editId) : null);
    return {
      sendOpen: !!S.sendTo || !!S.sendBlank, sendPrefill: S.sendTo, onSendClose: () => this.setState({ sendTo: null, sendBlank: false }),
      openSend: () => this.setState({ sendBlank: true }),
      theme, loading: S.loading,
      tabs: [],
      create: () => this.setState({ editId: 'new', draftAccs: [], panel: this.editPanel({}, D, []) }),
      hasScope: !!scopeLabel, scopeLabel, clearScope: () => this.setState({ scope: null }),
      cardsMeta, handlers, columns, rows, detail, bulk, searchKeys: ['contact', 'phone', 'accounts'], defaultSort: { key: 'last', dir: 'desc' },
      panel: S.panel,
      onPanelAction: (key, v) => {
        if (key === 'statusSave') {
          const target = D.contactById(S.statusId);
          const note = String(v.note || '').trim();
          if (!note) return this.toast({ key: 'warn', title: 'الملاحظات إلزامية', text: 'اكتب سبب التغيير قبل الحفظ.' });
          if (target) {
            const to = target.active === false;
            target.active = to;
            target.activeLog = [{ ts: Date.now(), by: 'سند ديجيتال', to, note }].concat(target.activeLog || []);
            D.logActivity((to ? 'تفعيل' : 'تعطيل') + ' الجهة «' + (target.name || target.phone) + '»', to ? 'primary' : 'warn');
            this.toast({ key: 'saved', title: to ? 'فُعّلت الجهة' : 'عُطّلت الجهة', text: 'سُجّلت الملاحظة في سجل التغييرات.' });
          }
          this.setState({ panel: null, statusId: null }); this.bump();
          return;
        }
        if (key === 'chatSave') {
          const target = D.contactById(S.chatId);
          const note = String(v.note || '').trim();
          if (!note) return this.toast({ key: 'warn', title: 'الملاحظات إلزامية', text: 'اكتب سبب التغيير قبل الحفظ.' });
          if (target) {
            const to = v.chat === 'yes';
            target.chatManual = to;
            target.chatLog = [{ ts: Date.now(), by: 'سند ديجيتال', to, note }].concat(target.chatLog || []);
            D.logActivity('تغيير حالة المحادثة لـ «' + (target.name || target.phone) + '» إلى ' + (to ? 'يوجد محادثة' : 'لا يوجد'), 'info');
            this.toast({ key: 'saved', title: 'حُدّثت حالة المحادثة', text: 'سُجّلت الملاحظة في سجل التغييرات.' });
          }
          this.setState({ panel: null, chatId: null }); this.bump();
          return;
        }
        if (key === 'save') {
          if (!String(v.phone || '').trim()) return this.toast({ key: 'warn', title: 'الرقم مطلوب' });
          const active = editing ? editing.active !== false : true;
          const hadIn = !!D.messages.find((m) => editing && m.contactId === editing.id && m.direction === 'in');
          const chatManual = hadIn ? undefined : v.chat === 'yes';
          const dacc = S.draftAccs || (editing && editing.linked ? (editing.accounts || []).map((a, i) => ({ name: a, type: (editing.accountTypes || [])[i] || editing.type })) : []);
          const accounts = dacc.map((a) => a.name), accountTypes = dacc.map((a) => a.type);
          if (S.editId === 'new') { const id = 'c-' + Date.now(); all.unshift({ id, name: String(v.name || '').trim(), phone: String(v.phone).trim(), type: accountTypes[0] || 'customer', accounts, accountTypes, linked: accounts.length > 0, active, inDevice: false }); this.toast({ key: 'saved', title: 'أُضيفت الجهة «' + (v.name || v.phone) + '»' }); }
          else if (editing) { Object.assign(editing, { name: String(v.name || '').trim(), phone: String(v.phone).trim(), active, ...(hadIn ? {} : { chatManual }), accounts, accountTypes, linked: accounts.length > 0, type: accountTypes[0] || editing.type }); D.logActivity('حُدّثت بيانات «' + (editing.name || editing.phone) + '»', 'info'); this.toast({ key: 'saved', title: 'حُفظت بيانات الجهة' }); }
          this.setState({ panel: null, editId: null, draftAccs: null }); this.bump();
        }
        if (key === 'delete' && editing) { const i = all.indexOf(editing); if (i > -1) all.splice(i, 1); this.toast({ key: 'deleted', title: 'حُذفت «' + (editing.name || editing.phone) + '»' }); this.setState({ panel: null, editId: null, draftAccs: null }); this.bump(); }
      },
      onPanelClose: () => this.setState({ panel: null, editId: null, chatId: null, statusId: null, draftAccs: null }),
      toastsMeta: { position: 'bottom-start', duration: 3500, types: [{ key: 'saved', tone: 'ok', icon: 'check' }, { key: 'linked', tone: 'ok', icon: 'check' }, { key: 'queued', tone: 'info', icon: 'send' }, { key: 'deleted', tone: 'danger', icon: 'x' }, { key: 'warn', tone: 'warn', icon: 'alert' }] },
      toastFire: S.fire,
    };
  }
}
</script>
</body>
</html>
