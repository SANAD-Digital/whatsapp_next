<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../shared/support.js"></script>
<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="18" fill="#0F7A63"/><circle cx="50" cy="46" r="22" fill="#fff"/><path d="M28 76l5-13 10 3z" fill="#fff"/></svg></template>
</head>
<body>
<x-dc>
<helmet>
<script src="../shared/ui-kit.js?v=3"></script>
<script src="../shared/hub-data.global.js?v=5"></script>
<script src="../shared/hub-pages.js?v=1"></script>
<script src="../shared/hub-shared.js?v=2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#F5F7F6;--surface:#FFFFFF;--sunken:#EEF2F0;--border:#E3E8E6;--border-2:#C9D2CF;--ink:#0F1A18;--ink-2:#33423F;--ink-3:#55645F;--ink-4:#62716D;--pri:#0F7A63;--pri-d:#0A6250;--pri-s:#DFF1EC;--pri-sb:#B6DDD2;--on-pri:#FFFFFF;--ok:#1A8B50;--ok-s:#E1F3E8;--ok-i:#16713F;--ok-sb:#B9E2CA;--wn:#9A6C14;--wn-s:#FBF1DC;--wn-i:#8A6116;--wn-ix:#6F4E10;--wn-sb:#EFDCB4;--dg:#C9524B;--dg-s:#FBEAE8;--dg-i:#A93A34;--dg-sb:#F2CBC7;--nf:#2568AF;--nf-s:#E4EFFA;--nf-i:#1F5A97;--nf-sb:#C2DCF2;--shadow-sm:0 1px 2px rgba(23,33,31,.06);--shadow-lg:0 18px 40px -26px rgba(23,33,31,.5);}
  [data-theme="dark"]{--bg:#111A1D;--surface:#172226;--sunken:#1E2C31;--border:#2A363B;--border-2:#334247;--ink:#E4EBE9;--ink-2:#C4D0CD;--ink-3:#9CACA9;--ink-4:#94A4A1;--pri:#17A184;--pri-d:#63D3B8;--pri-s:#0D3730;--pri-sb:#1A5347;--on-pri:#04201A;--ok:#2FAF63;--ok-s:#103220;--ok-i:#6CD79C;--ok-sb:#1B4E33;--wn:#D9A33A;--wn-s:#37290E;--wn-i:#EEC069;--wn-ix:#F3D18A;--wn-sb:#54401A;--dg:#DE6F68;--dg-s:#3A1D1B;--dg-i:#F0A49E;--dg-sb:#562A27;--nf:#3E82CC;--nf-s:#14263C;--nf-i:#8FBAE8;--nf-sb:#213C60;--shadow-sm:0 1px 2px rgba(0,0,0,.3);--shadow-lg:0 18px 40px -26px rgba(0,0,0,.75);}
  html,body{margin:0;padding:0;background:var(--bg);}
  body{font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:var(--ink);}
  *{box-sizing:border-box;}
  a{color:var(--pri);text-decoration:none;} a:hover{color:var(--pri-d);text-decoration:underline;}
  input,button{font-family:inherit;}
  .lv-host > .sc-host{flex:1 1 0%;min-height:0;min-width:0;display:flex;overflow:hidden}
  .lv-host > .sc-host > *{flex:1 1 0%;min-height:0;min-width:0}
</style>
</helmet>
<div data-screen-label="الأوامر" dir="rtl" style="flex:1;min-height:0;height:100%;overflow-y:auto;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif">
  <div style="flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;padding:16px;width:100%">
    <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;flex:none">
      <div style="display:flex;flex-direction:column;gap:4px;min-width:0">
        <h1 style="margin:0;font-size:18px;font-weight:700;letter-spacing:-.01em">الأوامر</h1>
        <span style="font-size:12px;color:var(--ink-3)">الأمر كلمة يكتبها العميل. الدالة هي ما يُنفَّذ خلفه ويقرأ من الأستاذ المساعد.</span>
      </div>
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <span onClick="{{ openFunctions }}" style="display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--border-2);background:var(--surface);color:var(--ink-2);font-size:12px;font-weight:600;cursor:pointer" style-hover="background:var(--pri-s);border-color:var(--pri-sb);color:var(--pri-d)">مركز الدوال<span dir="ltr" style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-4)">{{ fnCount }}</span></span>
        <button type="button" onClick="{{ create }}" style="min-height:36px;padding:0 14px;border-radius:8px;border:none;background:var(--pri);color:var(--on-pri);font-size:13px;font-weight:600;cursor:pointer">+ أمر جديد</button>
      </div>
    </div>

    <dc-import name="Cards" meta="{{ cardsMeta }}" handlers="{{ handlers }}" loading="{{ loading }}" lang="ar" theme="{{ theme }}" density="compact" embed="{{ true }}" show-docs="{{ false }}" hint-size="100%,72px"></dc-import>

    <div class="lv-host" style="flex:1;min-height:340px;display:flex;overflow:hidden">
      <dc-import name="List View" loading="{{ loading }}" columns="{{ columns }}" rows="{{ rows }}" detail="{{ detail }}" on-open="{{ onOpen }}" bulk="{{ bulk }}" unit="أمر" search-placeholder="كلمة الأمر، مرادف، أو اسم دالة…" search-keys="{{ searchKeys }}" export-name="commands" default-sort="{{ defaultSort }}" pinned="{{ pinned }}" page-size="{{ 50 }}" density="compact" theme="{{ theme }}" hint-size="100%,100%"></dc-import>
    </div>
  </div>

  <sc-if value="{{ editorOpen }}" hint-placeholder-val="{{ false }}">
    <dc-import name="Command Editor" command="{{ editCmd }}" functions="{{ fnList }}" party-types="{{ partyTypes }}" on-save="{{ onSaveCmd }}" on-delete="{{ onDeleteCmd }}" on-close="{{ onPanelClose }}" theme="{{ theme }}" embed="{{ true }}" hint-size="0,0"></dc-import>
  </sc-if>
  <dc-import name="Confirm Dialog" meta="{{ confirmMeta }}" handlers="{{ handlers }}" open-key="{{ confirmKey }}" on-close="{{ onConfirmClose }}" lang="ar" theme="{{ theme }}" embed="{{ true }}" show-docs="{{ false }}" hint-size="0,0"></dc-import>
  <dc-import name="Toasts" meta="{{ toastsMeta }}" fire="{{ toastFire }}" position="bottom-start" lang="ar" theme="{{ theme }}" embed="{{ true }}" show-docs="{{ false }}" hint-size="0,0"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:900},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;light&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;tsType&quot;:&quot;'light' | 'dark'&quot;},&quot;onNavigate&quot;:{&quot;editor&quot;:null,&quot;default&quot;:null,&quot;tsType&quot;:&quot;(route: string, filter?: object) =&gt; void&quot;}}">
const ROUTE = '/commands';

class Component extends DCLogic {
  state = { ready: typeof window !== 'undefined' && !!window.HubData, sel: null, confirmKey: null, pendingIds: [], fire: null, rev: 0, loading: true };
  componentDidMount() { const w = () => { if (window.HubData && window.HubShared && window.UIKit) { this.setState({ ready: true }); setTimeout(() => this.setState({ loading: false }), 220); } else this.t = setTimeout(w, 40); }; w(); }
  componentWillUnmount() { clearTimeout(this.t); }
  toast(f) { this.setState((s) => ({ fire: { ...f, n: (s.fire ? s.fire.n : 0) + 1 } })); }
  bump() { this.setState((s) => ({ rev: s.rev + 1 })); }
  theme() { return this.props.theme || (typeof document !== 'undefined' && document.documentElement.getAttribute('data-theme')) || 'light'; }

  renderVals() {
    const S = this.state, D = window.HubData, H = window.HubShared, theme = this.theme();
    const empty = { theme, loading: true, handlers: {}, fnCount: '—', create: () => {}, openFunctions: () => {}, cardsMeta: { sections: [] }, columns: [], rows: [], detail: null, bulk: [], searchKeys: [], defaultSort: null, pinned: [], editorOpen: false, editCmd: null, fnList: [], partyTypes: [], onSaveCmd: () => {}, onDeleteCmd: () => {}, onPanelClose: () => {}, confirmMeta: { dialogs: [] }, confirmKey: null, onConfirmClose: () => {}, toastsMeta: { types: [] }, toastFire: null };
    if (!D || !H || !S.ready) return empty;

    const f = D.fmt, all = D.commands || [], fns = D.functions || [];
    const go = (route, filter) => { if (this.props.onNavigate) return this.props.onNavigate(route, filter); H.goRoute(route, filter); };
    const PT = D.PARTY_TYPES || {};
    const ptKeys = Object.keys(PT);
    const ptLabel = (k) => (PT[k] ? PT[k].ar : k);

    const active = all.filter((c) => c.status === 'active');
    const runs = all.reduce((n, c) => n + (c.runs30d || 0), 0);
    const inbox = D.inboxPending ? D.inboxPending() : { count: 0 };
    const sel = S.sel ? all.find((c) => c.id === S.sel) : null;

    const handlers = {
      openInbound: () => go('/messages/inbound'),
      openFunctions: () => go('/functions'),
      remove: () => {
        const ids = S.pendingIds;
        ids.forEach((id) => { const i = all.findIndex((c) => c.id === id); if (i !== -1) all.splice(i, 1); });
        this.setState({ pendingIds: [], sel: null });
        this.toast({ key: 'removed', title: 'حُذف ' + f.n(ids.length) + ' أمر', text: 'النصوص الواردة المطابقة له لن تُنفّذ أي دالة بعد الآن.' });
      },
      setStatus: (status) => {
        const ids = S.pendingIds;
        ids.forEach((id) => { const c = all.find((x) => x.id === id); if (c) c.status = status; });
        this.setState({ pendingIds: [] });
        this.toast({ key: status === 'active' ? 'activated' : 'paused', title: (status === 'active' ? 'فُعّل ' : 'أُوقف ') + f.n(ids.length) + ' أمر' });
        this.bump();
      },
    };

    /* ——— المؤشرات (Cards) ——— */
    const cardsMeta = { handlers, sections: [{ min: 200, mobileColumns: 2, cards: [
      { kind: 'stat', icon: 'code', label: 'عدد الأوامر', value: f.n(all.length), valueMono: true, note: f.n(all.reduce((n, c) => n + (c.synonyms || []).length, 0)) + ' مرادف مسجّل' },
      { kind: 'stat', icon: 'check', tone: 'ok', label: 'المفعّلة', value: f.n(active.length), valueMono: true, note: f.n(all.length - active.length) + ' موقوفة' },
      { kind: 'stat', icon: 'sigma', tone: 'info', label: 'التنفيذات (30ي)', value: f.n(runs), valueMono: true, note: 'استدعاء دالة من أمر وارد' },
      { kind: 'stat', icon: 'warn', tone: inbox.count ? 'warn' : undefined, label: 'وارد بلا أمر مطابق', value: f.n(inbox.count), valueMono: true, note: inbox.count ? 'أضف مرادفاً ليُطابق تلقائياً' : 'كل الوارد طابق أمراً', action: 'openInbound' },
    ] }] };

    /* ——— القائمة (List View) ——— */
    const stCell = (c) => c.status === 'active'
      ? { text: 'مفعّل', bg: 'var(--ok-s)', fg: 'var(--ok-i)', dot: 'var(--ok)', sort: 'a' }
      : { text: 'موقوف', bg: 'var(--sunken)', fg: 'var(--ink-3)', dot: 'var(--ink-4)', sort: 'b' };
    const columns = [
      { key: 'code', label: 'الأمر', w: 130, kind: 'mono', weight: 600, group: true },
      { key: 'fn', label: 'الدالة المنفَّذة', w: 210, group: true, filter: true },
      { key: 'synonyms', label: 'المرادفات', w: 220, color: 'var(--ink-3)' },
      { key: 'types', label: 'الجهات المسموح لها', w: 170, color: 'var(--ink-3)' },
      { key: 'status', label: 'الحالة', w: 110, kind: 'badge', group: true, filter: true },
      { key: 'runs30d', label: 'التنفيذات (30ي)', w: 130, kind: 'num', align: 'end' },
    ];
    const rows = all.map((c) => ({
      id: c.id, code: c.code, fn: c.fn,
      synonyms: (c.synonyms || []).join('، ') || '—',
      types: (c.allowedTypes || []).map(ptLabel).join('، ') || 'الجميع',
      status: stCell(c), runs30d: c.runs30d || 0, _c: c,
    }));

    const detail = (r) => {
      const c = r._c, fn = fns.find((x) => x.name === c.fn);
      return {
        alert: fn && fn.status !== 'active' ? { tone: 'warn', title: 'الدالة «' + fn.name + '» موقوفة', lines: ['الأمر سيُطابق النص لكن لن يُنفَّذ حتى تُفعَّل الدالة من مركز الدوال.'] } : null,
        fields: [
          { k: 'كلمة الأمر', v: c.code, mono: true }, { k: 'الدالة المنفَّذة', v: c.fn },
          { k: 'مجموعة الدالة', v: fn ? fn.category : '—' }, { k: 'الحالة', v: c.status === 'active' ? 'مفعّل' : 'موقوف' },
          { k: 'يشترط ربط الجهة', v: c.requiresLink ? 'نعم' : 'لا' }, { k: 'التنفيذات (30ي)', v: f.n(c.runs30d || 0), mono: true },
          { k: 'متوسط زمن التنفيذ', v: fn ? fn.avgMs + ' ms' : '—', mono: true },
        ],
        blocks: [
          { label: 'المرادفات', text: (c.synonyms || []).join('\n') || 'لا مرادفات' },
          { label: 'أنواع الجهات المسموح لها', text: (c.allowedTypes || []).map(ptLabel).join('، ') || 'الجميع' },
        ],
        actions: [
          { label: 'تحرير الأمر', onClick: () => this.setState({ sel: c.id }) },
          { label: c.status === 'active' ? 'إيقاف الأمر' : 'تفعيل الأمر', onClick: () => { this.setState({ pendingIds: [c.id] }); handlers.setStatus(c.status === 'active' ? 'inactive' : 'active'); } },
          { label: 'فتح الدالة', onClick: () => go('/functions', { kind: 'search', value: c.fn }) },
          { label: 'حذف الأمر', tone: 'danger', onClick: () => this.setState({ pendingIds: [c.id], confirmKey: 'remove' }) },
        ],
      };
    };

    const bulk = [
      { label: 'تفعيل المحددة', onClick: (s) => { this.setState({ pendingIds: s.map((r) => r.id) }); handlers.setStatus('active'); } },
      { label: 'إيقاف المحددة', onClick: (s) => { this.setState({ pendingIds: s.map((r) => r.id) }); handlers.setStatus('inactive'); } },
      { label: 'حذف المحددة', onClick: (s) => this.setState({ pendingIds: s.map((r) => r.id), confirmKey: 'remove' }) },
    ];

    /* ——— محرّر الأمر (Command Editor) ——— */
    const partyTypes = ptKeys.map((k) => ({ key: k, label: ptLabel(k) }));

    const nPending = S.pendingIds.length;
    const pendingActive = S.pendingIds.map((id) => all.find((c) => c.id === id)).filter((c) => c && c.status === 'active').length;
    const confirmMeta = { handlers, dialogs: [
      { key: 'remove', tone: 'danger', icon: 'trash', title: 'حذف ' + f.n(nPending) + ' أمر؟',
        text: 'الحذف نهائي. النصوص الواردة المطابقة لن تنفّذ أي دالة، وسيحصل المرسل على ردّ بقائمة الأوامر المتاحة.',
        facts: [
          { label: 'أوامر ستُحذف', value: f.n(nPending), mono: true, tone: 'danger' },
          { label: 'منها مفعّلة الآن', value: f.n(pendingActive), mono: true, tone: pendingActive ? 'warn' : undefined },
          { label: 'تبقى أوامر', value: f.n(Math.max(0, all.length - nPending)), mono: true },
        ],
        checks: pendingActive > 0 ? [{ key: 'sure', label: 'أفهم أن ' + f.n(pendingActive) + ' أمراً مفعّلاً سيتوقف عن العمل فوراً', required: true }] : [],
        confirmLabel: 'احذف الأوامر', action: 'remove' },
    ] };

    return {
      theme, loading: S.loading, handlers, fnCount: f.n(fns.length),
      openFunctions: () => go('/functions'),
      create: () => {
        const id = 'cmd-' + Date.now();
        all.unshift({ id, code: 'أمر', synonyms: [], fn: (fns[0] || {}).name || '', status: 'inactive', runs30d: 0, allowedTypes: ['customer'], requiresLink: true });
        this.setState({ sel: id });
      },
      cardsMeta, columns, rows, detail, bulk,
      searchKeys: ['code', 'fn', 'synonyms'], defaultSort: { key: 'runs30d', dir: 'desc' }, pinned: ['code'],
      onOpen: (r) => this.setState({ sel: r.id }),
      editorOpen: !!sel, editCmd: sel, fnList: fns, partyTypes,
      onSaveCmd: (dr) => {
        if (!sel) return;
        Object.assign(sel, dr);
        const types = dr.allowedTypes || [];
        this.toast({ key: 'saved', title: 'حُفظ الأمر «' + sel.code + '»', text: sel.status === 'active' ? 'ينفّذ ' + sel.fn + ' لـ' + (types.length ? types.map(ptLabel).join('، ') : 'لا أحد — راجع الصلاحيات') : 'الأمر موقوف؛ فعّله ليبدأ العمل.' });
        if (D.logActivity) D.logActivity('حُدّث الأمر «' + sel.code + '»', 'primary');
        this.setState({ sel: null });
        this.bump();
      },
      onDeleteCmd: () => { if (sel) this.setState({ pendingIds: [sel.id], confirmKey: 'remove' }); },
      onPanelClose: () => this.setState({ sel: null }),
      confirmMeta, confirmKey: S.confirmKey, onConfirmClose: () => this.setState({ confirmKey: null }),
      toastsMeta: { position: 'bottom-start', duration: 3800, types: [{ key: 'saved', tone: 'ok', icon: 'check' }, { key: 'activated', tone: 'ok', icon: 'check' }, { key: 'paused', tone: 'warn', icon: 'alert' }, { key: 'removed', tone: 'danger', icon: 'x' }] },
      toastFire: S.fire,
    };
  }
}
</script>
</body>
</html>
