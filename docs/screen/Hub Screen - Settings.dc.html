<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../shared/support.js"></script>
<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="18" fill="#0F7A63"/><circle cx="50" cy="46" r="22" fill="#fff"/><path d="M28 76l5-13 10 3z" fill="#fff"/></svg></template>
</head>
<body>
<x-dc>
<helmet>
<script src="../shared/ui-kit.js?v=3"></script>
<script src="../shared/hub-data.global.js?v=5"></script>
<script src="../shared/hub-pages.js?v=1"></script>
<script src="../shared/hub-shared.js?v=2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#F5F7F6;--surface:#FFFFFF;--sunken:#EEF2F0;--border:#E3E8E6;--border-2:#C9D2CF;--ink:#0F1A18;--ink-2:#33423F;--ink-3:#55645F;--ink-4:#62716D;--pri:#0F7A63;--pri-d:#0A6250;--pri-s:#DFF1EC;--pri-sb:#B6DDD2;--on-pri:#FFFFFF;--ok:#1A8B50;--ok-s:#E1F3E8;--ok-i:#16713F;--ok-sb:#B9E2CA;--wn:#9A6C14;--wn-s:#FBF1DC;--wn-i:#8A6116;--wn-ix:#6F4E10;--wn-sb:#EFDCB4;--dg:#C9524B;--dg-s:#FBEAE8;--dg-i:#A93A34;--dg-sb:#F2CBC7;--nf:#2568AF;--nf-s:#E4EFFA;--nf-i:#1F5A97;--nf-sb:#C2DCF2;--shadow-sm:0 1px 2px rgba(23,33,31,.06);--shadow-lg:0 18px 40px -26px rgba(23,33,31,.5);}
  [data-theme="dark"]{--bg:#111A1D;--surface:#172226;--sunken:#1E2C31;--border:#2A363B;--border-2:#334247;--ink:#E4EBE9;--ink-2:#C4D0CD;--ink-3:#9CACA9;--ink-4:#94A4A1;--pri:#17A184;--pri-d:#63D3B8;--pri-s:#0D3730;--pri-sb:#1A5347;--on-pri:#04201A;--ok:#2FAF63;--ok-s:#103220;--ok-i:#6CD79C;--ok-sb:#1B4E33;--wn:#D9A33A;--wn-s:#37290E;--wn-i:#EEC069;--wn-ix:#F3D18A;--wn-sb:#54401A;--dg:#DE6F68;--dg-s:#3A1D1B;--dg-i:#F0A49E;--dg-sb:#562A27;--nf:#3E82CC;--nf-s:#14263C;--nf-i:#8FBAE8;--nf-sb:#213C60;--shadow-sm:0 1px 2px rgba(0,0,0,.3);--shadow-lg:0 18px 40px -26px rgba(0,0,0,.75);}
  html,body{margin:0;padding:0;background:var(--bg);}
  body{font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:var(--ink);}
  *{box-sizing:border-box;}
  a{color:var(--pri);text-decoration:none;} a:hover{color:var(--pri-d);text-decoration:underline;}
  input,button{font-family:inherit;}
  .lv-host > .sc-host{flex:1 1 0%;min-height:0;min-width:0;display:flex;overflow:hidden}
  .lv-host > .sc-host > *{flex:1 1 0%;min-height:0;min-width:0}
</style>
</helmet>
<div data-screen-label="الإعدادات" dir="rtl" style="flex:1;min-height:0;height:100%;overflow-y:auto;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif">
  <div style="display:flex;flex-direction:column;gap:12px;padding:16px;width:100%">
    <div style="display:flex;flex-direction:column;gap:4px;flex:none">
      <h1 style="margin:0;font-size:18px;font-weight:700;letter-spacing:-.01em">الإعدادات</h1>
      <span style="font-size:12px;color:var(--ink-3)">الربط بالمنصة والويب هوك والأدوار وسجل التدقيق.</span>
    </div>

    <dc-import name="Toolbar" meta="{{ toolbarMeta }}" handlers="{{ handlers }}" on-tab="{{ onTab }}" lang="ar" theme="{{ theme }}" density="compact" embed="{{ true }}" show-preview="{{ false }}" show-docs="{{ false }}" hint-size="100%,56px"></dc-import>

    <dc-import name="Cards" meta="{{ cardsMeta }}" handlers="{{ handlers }}" loading="{{ loading }}" lang="ar" theme="{{ theme }}" density="compact" embed="{{ true }}" show-docs="{{ false }}" hint-size="100%,260px"></dc-import>

    <sc-if value="{{ hasForm }}" hint-placeholder-val="{{ false }}">
      <dc-import name="Form" meta="{{ formMeta }}" handlers="{{ handlers }}" on-change="{{ onField }}" lang="ar" theme="{{ theme }}" density="compact" embed="{{ true }}" show-docs="{{ false }}" max-width="{{ 2400 }}" hint-size="100%,200px"></dc-import>
    </sc-if>

    <sc-if value="{{ hasList }}" hint-placeholder-val="{{ false }}">
      <div class="lv-host" style="display:flex;overflow:hidden;height:420px;flex:none">
        <dc-import name="List View" columns="{{ columns }}" rows="{{ rows }}" unit="{{ listUnit }}" search-placeholder="{{ listSearch }}" search-keys="{{ searchKeys }}" export-name="settings" default-sort="{{ defaultSort }}" page-size="{{ 50 }}" density="compact" theme="{{ theme }}" hint-size="100%,100%"></dc-import>
      </div>
    </sc-if>
  </div>

  <dc-import name="Confirm Dialog" meta="{{ confirmMeta }}" handlers="{{ handlers }}" open-key="{{ confirmKey }}" on-close="{{ onConfirmClose }}" lang="ar" theme="{{ theme }}" embed="{{ true }}" show-docs="{{ false }}" hint-size="0,0"></dc-import>
  <dc-import name="Toasts" meta="{{ toastsMeta }}" fire="{{ toastFire }}" position="bottom-start" lang="ar" theme="{{ theme }}" embed="{{ true }}" show-docs="{{ false }}" hint-size="0,0"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:900},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;light&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;tsType&quot;:&quot;'light' | 'dark'&quot;},&quot;onNavigate&quot;:{&quot;editor&quot;:null,&quot;default&quot;:null,&quot;tsType&quot;:&quot;(route: string, filter?: object) =&gt; void&quot;}}">
const ROUTE = '/settings';
const CREDS = [
  { key: 'clientKey', label: 'مفتاح العميل', value: 'msr_live_4c81d2f9ab' },
  { key: 'apiKey', label: 'مفتاح API', value: 'api_9f2b7c41e8d0a5' },
  { key: 'secret', label: 'السر (Secret)', value: 'sk_7d31fa0c9e42b8' },
];
const EVENTS = [
  { v: 'message.status', l: 'تحديث حالة رسالة' },
  { v: 'message.inbound', l: 'رسالة واردة' },
  { v: 'device.state', l: 'تغيّر حالة جهاز' },
  { v: 'campaign.done', l: 'انتهاء حملة' },
];
const ROLES = [
  { name: 'مدير الحسابات', initials: 'مح', count: 2, color: '#2F6FA8', desc: 'وصول كامل: الأجهزة، النماذج، الحملات، الفواتير، والإعدادات.', perms: ['إدارة الأجهزة والاقتران', 'إنشاء وتشغيل الحملات', 'تحرير النماذج والأوامر', 'الاشتراك والمحفظة', 'الإعدادات وسجل التدقيق'] },
  { name: 'محاسب', initials: 'مس', count: 5, color: '#12796B', desc: 'يشغّل النماذج ويتابع السجل، بلا صلاحية على الإعدادات أو الفواتير.', perms: ['عرض السجل والتقارير', 'إرسال رسائل اختبار', 'تحرير نماذج الرسائل', 'بلا صلاحية على الفواتير'] },
  { name: 'مشاهد', initials: 'مش', count: 3, color: '#6B4FA0', desc: 'قراءة فقط لكل الشاشات — مناسب للمراجعة والتدقيق.', perms: ['عرض اللوحة والسجل', 'تصدير التقارير', 'بلا أي إجراء تنفيذي'] },
];
const ATTEMPTS = [
  { event: 'message.status', code: 200, at: Date.now() - 4 * 60000 },
  { event: 'message.inbound', code: 200, at: Date.now() - 12 * 60000 },
  { event: 'message.status', code: 500, at: Date.now() - 38 * 60000 },
  { event: 'device.state', code: 200, at: Date.now() - 64 * 60000 },
  { event: 'message.status', code: 408, at: Date.now() - 96 * 60000 },
];

class Component extends DCLogic {
  state = { ready: typeof window !== 'undefined' && !!window.HubData, loading: true, tab: 'platform', shown: {}, v: {}, webhookOn: false, events: ['message.status', 'message.inbound'], tested: false, confirmKey: null, pendingCred: null, fire: null, rev: 0 };
  componentDidMount() { const w = () => { if (window.HubData && window.HubShared && window.UIKit) { this.setState({ ready: true }); setTimeout(() => this.setState({ loading: false }), 200); } else this.t = setTimeout(w, 40); }; w(); }
  componentWillUnmount() { clearTimeout(this.t); }
  toast(f) { this.setState((s) => ({ fire: { ...f, n: (s.fire ? s.fire.n : 0) + 1 } })); }
  bump() { this.setState((s) => ({ rev: s.rev + 1 })); }
  theme() { return this.props.theme || (typeof document !== 'undefined' && document.documentElement.getAttribute('data-theme')) || 'light'; }
  mask(v) { return v.slice(0, 4) + '•'.repeat(Math.max(4, v.length - 8)) + v.slice(-4); }

  renderVals() {
    const S = this.state, D = window.HubData, H = window.HubShared, theme = this.theme();
    const empty = { theme, loading: true, handlers: {}, toolbarMeta: { tabs: [] }, onTab: () => {}, cardsMeta: { sections: [] }, hasForm: false, formMeta: { sections: [] }, onField: () => {}, hasList: false, columns: [], rows: [], listUnit: '', listSearch: '', searchKeys: [], defaultSort: null, confirmMeta: { dialogs: [] }, confirmKey: null, onConfirmClose: () => {}, toastsMeta: { types: [] }, toastFire: null };
    if (!D || !H || !S.ready) return empty;

    const f = D.fmt, tab = S.tab, V = S.v;
    const go = (route, filter) => { if (this.props.onNavigate) return this.props.onNavigate(route, filter); H.goRoute(route, filter); };
    const webhookOn = S.webhookOn;

    const handlers = {
      testConn: () => { this.setState({ tested: true }); this.toast({ key: 'tested', title: 'الاتصال سليم', text: 'زمن الاستجابة 318ms · المنطقة riyadh-1' }); },
      toggleCred: (key) => this.setState({ shown: { ...S.shown, [key]: !S.shown[key] } }),
      askRotate: () => this.setState({ confirmKey: 'rotate' }),
      rotate: () => { this.toast({ key: 'rotated', title: 'دُوِّرت المفاتيح', text: 'أي تكامل يستخدم المفتاح القديم سيتوقف فوراً.' }); this.setState({ shown: {} }); },
      enableWebhook: () => { this.setState({ webhookOn: true }); D.logActivity('فُعّل الويب هوك', 'primary'); this.toast({ key: 'webhook', title: 'فُعّل الويب هوك', text: 'ستصل تحديثات الحالة والرسائل الواردة إلى الرابط.' }); this.bump(); },
      copyUrl: () => { try { navigator.clipboard.writeText('https://hooks.masar.sa/wa/9f2b7c41'); } catch (e) {} this.toast({ key: 'copied', title: 'نُسخ رابط الاستقبال' }); },
      saveWebhook: (vals) => { this.setState({ events: Array.isArray(vals.events) ? vals.events : S.events }); this.toast({ key: 'saved', title: 'حُفظت إعدادات الويب هوك' }); },
      saveOrg: () => this.toast({ key: 'saved', title: 'حُفظت بيانات المنشأة' }),
      openDevices: () => go('/devices'),
      openInbound: () => go('/messages/inbound'),
    };

    const toolbarMeta = {
      tabs: [
        { key: 'platform', label: 'الربط بالمنصة' },
        { key: 'webhook', label: 'الويب هوك', count: webhookOn ? S.events.length : 0, tone: webhookOn ? 'ok' : 'danger' },
        { key: 'audit', label: 'سجل التدقيق', count: (D.activity || []).length },
      ],
      tab,
    };

    /* ——— محتوى كل تبويب ——— */
    let cardsMeta = { handlers, sections: [] }, formMeta = null, list = null;

    if (tab === 'platform') {
      cardsMeta = { handlers, sections: [
        { min: 420, cards: [{ kind: 'alert', tone: 'ok', label: 'الربط بالمنصة مكتمل ونشِط', note: S.tested ? 'آخر فحص: الآن · زمن الاستجابة 318ms · المنطقة riyadh-1' : 'آخر فحص ناجح قبل دقائق · المنطقة riyadh-1', cta: 'اختبار الاتصال', action: 'testConn' }] },
        { min: 340, cards: [
          { kind: 'panel', label: 'بيانات الاعتماد', note: 'مخزّنة مشفّرة · تظهر مرة واحدة عند التوليد', cta: 'تدوير المفاتيح', action: 'askRotate',
            rows: CREDS.map((c) => ({ label: c.label, value: S.shown[c.key] ? c.value : this.mask(c.value), action: 'toggleCred', args: c.key, key: 'cred' })) },
          { kind: 'panel', label: 'خطوات التهيئة', note: (D.setup || []).filter((s) => s.done).length + ' من ' + (D.setup || []).length + ' مكتملة',
            rows: (D.setup || []).map((s) => ({ label: s.label, badge: s.done ? 'مكتملة' : 'ناقصة', badgeTone: s.done ? 'ok' : 'warn', sub: s.note })) },
        ] },
      ] };
      formMeta = { sections: [] };
    }

    if (tab === 'webhook') {
      cardsMeta = { handlers, sections: [
        { min: 420, cards: [{
          kind: 'alert', tone: webhookOn ? 'ok' : 'danger',
          label: webhookOn ? 'الويب هوك مفعّل' : 'الويب هوك غير مفعّل',
          note: webhookOn ? 'يستقبل ' + S.events.length + ' نوع حدث. يجب أن يستجيب الرابط بـ200 خلال ثانيتين، وإلا يُعاد الإرسال حتى ثلاث مرات.' : 'بدون تفعيله لا تصل الرسائل الواردة ولا تحديثات الحالة — تبقى الحالة «مرسل» فقط.',
          cta: webhookOn ? 'نسخ الرابط' : 'تفعيل الآن', ctaStyle: webhookOn ? undefined : 'solid', action: webhookOn ? 'copyUrl' : 'enableWebhook',
        }] },
        { min: 340, cards: [
          { kind: 'panel', label: 'رابط الاستقبال', note: 'POST · JSON', cta: 'نسخ', action: 'copyUrl', rows: [
            { label: 'الرابط', value: 'hooks.masar.sa/wa/9f2b7c41' },
            { label: 'التوقيع', value: 'HMAC-SHA256' },
            { label: 'المهلة', value: '2s' },
            { label: 'إعادة المحاولة', value: '3 مرات' },
          ] },
          { kind: 'panel', label: 'آخر المحاولات', note: 'خلال ساعتين', rows: ATTEMPTS.slice(0, 5).map((a) => ({ label: a.event, value: f.time(a.at), badge: String(a.code), badgeTone: a.code === 200 ? 'ok' : a.code === 408 ? 'warn' : 'danger' })) },
        ] },
      ] };
      formMeta = {
        title: 'الأحداث المُستقبَلة', sub: 'اختر ما يُرسَل إلى الرابط. تقليل الأحداث يقلّل الحمل على خادمك.', handlers,
        sections: [{ cols: 2, fields: [
          { key: 'events', type: 'multiselect', label: 'الأحداث', value: S.events, options: EVENTS },
          { key: 'retry', type: 'select', label: 'سياسة إعادة المحاولة', value: V.retry || '3', options: [{ v: '1', l: 'مرة واحدة' }, { v: '3', l: 'ثلاث مرات (موصى به)' }, { v: '5', l: 'خمس مرات' }] },
        ] }],
        actions: [{ key: 'saveWebhook', label: 'حفظ الإعدادات', variant: 'primary', action: 'saveWebhook' }],
      };
    }

    if (tab === 'roles') {
      cardsMeta = { handlers, sections: [{ min: 300, cards: ROLES.map((r) => ({
        kind: 'entity', label: r.name, note: f.n(r.count) + ' مستخدم', avatar: r.initials, avatarTone: 'primary',
        badge: 'دور', badgeTone: 'muted',
        meta: r.perms.slice(0, 4).map((p) => ({ label: '', value: p })),
        notice: { tone: 'info', icon: 'info', title: r.name, text: r.desc },
        actions: [{ label: 'تعديل الصلاحيات', key: 'editRole' }, { label: 'المستخدمون', key: 'roleUsers' }],
      })) }] };
    }

    if (tab === 'audit') {
      cardsMeta = { handlers, sections: [{ min: 220, mobileColumns: 2, cards: [
        { kind: 'stat', icon: 'chart', label: 'أحداث مسجّلة', value: f.n((D.activity || []).length), valueMono: true, note: 'آخر 30 يوماً' },
        { kind: 'stat', icon: 'warn', tone: 'warn', label: 'أحداث تحذيرية', value: f.n((D.activity || []).filter((a) => a.tone === 'warn').length), valueMono: true, note: 'إيقاف طابور، فصل جهاز' },
        { kind: 'stat', icon: 'user', tone: 'info', label: 'مستخدمون فاعلون', value: f.n(ROLES.reduce((n, r) => n + r.count, 0)), valueMono: true, note: 'عبر ' + ROLES.length + ' أدوار' },
      ] }] };
      list = {
        unit: 'حدث', search: 'نص الحدث…', searchKeys: ['text'], defaultSort: { key: 'ts', dir: 'desc' },
        columns: [
          { key: 'text', label: 'الحدث', w: 420, weight: 600 },
          { key: 'tone', label: 'النوع', w: 120, kind: 'badge', group: true, filter: true },
          { key: 'ts', label: 'الوقت', w: 150, kind: 'date' },
          { key: 'ago', label: 'قبل', w: 120, color: 'var(--ink-3)' },
        ],
        rows: (D.activity || []).map((a, i) => ({
          id: 'a' + i, text: a.text, ts: a.ts, ago: f.ago(a.ts),
          tone: { text: { danger: 'خطر', warn: 'تحذير', primary: 'إجراء', info: 'معلومة', muted: 'عادي' }[a.tone] || 'إجراء', bg: { danger: 'var(--dg-s)', warn: 'var(--wn-s)', primary: 'var(--pri-s)', info: 'var(--nf-s)' }[a.tone] || 'var(--sunken)', fg: { danger: 'var(--dg-i)', warn: 'var(--wn-i)', primary: 'var(--pri-d)', info: 'var(--nf-i)' }[a.tone] || 'var(--ink-3)', dot: { danger: 'var(--dg)', warn: 'var(--wn)', primary: 'var(--pri)', info: 'var(--nf)' }[a.tone] || 'var(--ink-4)', sort: a.tone },
        })),
      };
    }

    const confirmMeta = { handlers, dialogs: [
      { key: 'rotate', tone: 'danger', icon: 'trash', title: 'تدوير مفاتيح الاعتماد؟',
        text: 'المفاتيح الجديدة تظهر مرة واحدة. أي تكامل يستخدم المفاتيح القديمة سيتوقف فوراً — بلّغ المطوّر قبل التدوير.',
        facts: [
          { label: 'مفاتيح ستُستبدل', value: f.n(CREDS.length), mono: true, tone: 'danger' },
          { label: 'أجهزة مرتبطة', value: f.n((D.devices || []).length), mono: true },
          { label: 'الويب هوك', value: webhookOn ? 'مفعّل — يحتاج تحديث السر' : 'غير مفعّل', tone: webhookOn ? 'warn' : undefined },
        ],
        checks: [{ key: 'sure', label: 'أفهم أن التكاملات الحالية ستتوقف حتى تحديث المفاتيح', required: true }],
        confirmLabel: 'دوّر المفاتيح', action: 'rotate' },
    ] };

    return {
      theme, loading: S.loading, handlers,
      toolbarMeta, onTab: (k) => this.setState({ tab: k }),
      cardsMeta,
      hasForm: !!formMeta, formMeta: formMeta || { sections: [] },
      onField: (key, val) => this.setState({ v: { ...V, [key]: val }, events: key === 'events' ? val : S.events }),
      hasList: !!list,
      columns: list ? list.columns : [], rows: list ? list.rows : [],
      listUnit: list ? list.unit : '', listSearch: list ? list.search : '', searchKeys: list ? list.searchKeys : [], defaultSort: list ? list.defaultSort : null,
      confirmMeta, confirmKey: S.confirmKey, onConfirmClose: () => this.setState({ confirmKey: null }),
      toastsMeta: { position: 'bottom-start', duration: 3600, types: [{ key: 'tested', tone: 'ok', icon: 'check' }, { key: 'webhook', tone: 'ok', icon: 'check' }, { key: 'copied', tone: 'muted', icon: 'check' }, { key: 'saved', tone: 'ok', icon: 'check' }, { key: 'rotated', tone: 'danger', icon: 'alert' }] },
      toastFire: S.fire,
    };
  }
}
</script>
</body>
</html>
